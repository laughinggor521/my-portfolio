<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="个人主页、作品展示、文章与留言"><title>我的个人主页</title><link rel="stylesheet" href="/styles.css"><script src="/script.js" defer></script></head>

<main><section class="hero"><p class="eyebrow">个人主页 · 作品集 · 随笔</p><h1>你好，我是 <span>你的名字</span>。</h1><p class="lead">欢迎来到我的个人空间。这里记录我正在做的项目、学习过程与灵感。</p><div class="hero-actions"><a class="button primary" href="#projects">浏览作品</a><a class="button secondary" href="#about">了解更多</a></div><p class="hero-note">保持好奇，持续创造。</p></section>
<section class="section" id="about"><div class="section-heading"><p class="eyebrow">ABOUT</p><h2>关于我</h2></div><div class="about-card"><p>在这里写一段简短的自我介绍，介绍你的兴趣、技能、经历，以及你希望与访客分享的内容。</p><div class="chips"><span>持续学习</span><span>独立创作</span><span>开放交流</span></div></div></section>
<section class="section" id="projects"><div class="section-heading split"><div><p class="eyebrow">SELECTED WORK</p><h2>精选作品</h2></div><p class="muted">由后台管理并发布的项目</p></div><div id="project-list" class="cards"><p class="muted">正在加载作品…</p></div></section>
<section class="section" id="posts"><div class="section-heading split"><div><p class="eyebrow">WRITING</p><h2>最新文章</h2></div><p class="muted">记录想法与过程</p></div><div id="post-list" class="post-list"><p class="muted">正在加载文章…</p></div></section>
<section class="section" id="messages"><div class="section-heading"><p class="eyebrow">GUESTBOOK</p><h2>留言板</h2><p class="muted">留言经审核后显示，请友善交流。</p></div><form id="message-form" class="form-card"><div class="form-grid"><label>昵称<input name="nickname" maxlength="80" required placeholder="怎么称呼你？"></label><label class="honeypot" aria-hidden="true">网站<input name="website" tabindex="-1" autocomplete="off"></label></div><label>留言内容<textarea name="content" maxlength="2000" minlength="2" required rows="4" placeholder="写下你的想法…"></textarea></label><button class="button primary" type="submit">提交留言</button><p id="message-feedback" class="feedback" role="status"></p></form><div id="message-list" class="message-list"></div></section></main>
